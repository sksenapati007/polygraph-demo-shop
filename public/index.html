<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corner Café</title>
  <style>
    :root {
      --bg: #fbf8f3; --fg: #1f1a14; --muted: #6b6155; --card: #fff;
      --line: #e6ddd0; --accent: #8a3b12; --accent-fg: #fff; --ok: #1d6b3a;
      --radius: 0.75rem; --space: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.5; }
    header, main { max-width: 40rem; margin: 0 auto; padding: var(--space); }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 0; color: var(--muted); }
    ul.menu { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: var(--space);
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.75rem var(--space); }
    .item h2 { margin: 0; font-size: 1rem; }
    .item p { margin: 0; color: var(--muted); }
    button { font: inherit; border-radius: 999px; border: 0; padding: 0.6rem 1.1rem; min-height: 44px; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .add { background: var(--card); color: var(--accent); border: 2px solid var(--accent); }
    .cart { margin-top: 1.5rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space); }
    .cart h2 { margin: 0 0 0.5rem; font-size: 1.1rem; }
    .cart ul { margin: 0 0 0.75rem; padding-left: 1.1rem; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: var(--space); flex-wrap: wrap; }
    .checkout { background: var(--accent); color: var(--accent-fg); }
    .checkout:disabled { opacity: 0.5; cursor: not-allowed; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .promo { position: fixed; left: 0; right: 0; bottom: 0; background: var(--accent); color: var(--accent-fg);
      text-align: center; font-weight: 700; padding: 1rem; }
    .promo p { margin: 0; }
    @media (max-width: 40rem) { .promo { height: 40vh; display: grid; place-items: center; font-size: 1.25rem; } }
    #status { margin-top: 0.75rem; min-height: 1.5rem; font-weight: 600; color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <h1>Corner Café</h1>
    <p>Order ahead, skip the queue.</p>
  </header>
  <main>
    <section aria-labelledby="menu-title">
      <h2 id="menu-title" class="sr-only">Menu</h2>
      <ul class="menu" id="menu"></ul>
    </section>

    <section class="cart" aria-labelledby="cart-title">
      <h2 id="cart-title">Your order</h2>
      <ul id="lines"></ul>
      <div class="row">
        <p>Items: <strong id="count">0</strong> · Total: <strong id="total">AED 0</strong></p>
        <button class="checkout" id="checkout" disabled>Checkout</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <aside class="promo" aria-label="Offer"><p>Free samosa with every order over AED 15!</p></aside>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let products = [];

    function render(cart) {
      $("count").textContent = cart.count;
      $("total").textContent = `AED ${cart.total}`;
      $("lines").innerHTML = cart.items
        .map((l) => `<li>${l.qty} × ${products.find((p) => p.id === l.id).name}</li>`)
        .join("");
      $("checkout").disabled = cart.count === 0;
    }

    async function api(path, body) {
      const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
      return res.json();
    }

    products = await api("/api/products");
    $("menu").innerHTML = products
      .map((p) => `<li class="item"><div><h2>${p.name}</h2><p>AED ${p.price}</p></div>
        <button class="add" data-id="${p.id}" aria-label="Add ${p.name}">Add</button></li>`)
      .join("");
    $("menu").addEventListener("click", async (e) => {
      const id = e.target.closest("button")?.dataset.id;
      if (!id) return;
      render(await api("/api/cart/add", { id }));
      $("status").textContent = "";
    });
    $("checkout").addEventListener("click", async () => {
      const order = await api("/api/checkout", {});
      $("status").textContent = order.order ? `Order ${order.order} confirmed. AED ${order.total} paid.` : order.error;
      render(await api("/api/cart"));
    });
    render(await api("/api/cart"));
  </script>
</body>
</html>
